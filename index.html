<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apple TV</title>
<style>
:root{--bg:#05060a;--fg:#fff;--dim:rgba(255,255,255,.6);--glass:rgba(255,255,255,.12);--line:rgba(255,255,255,.14);--acc:#0a84ff;box-sizing:border-box}
:root[data-theme=light]{--bg:#e9ecf3;--fg:#10131a;--dim:rgba(16,19,26,.6);--glass:rgba(255,255,255,.55);--line:rgba(0,0,0,.1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wall{position:fixed;inset:0;background:radial-gradient(60% 50% at 20% 25%,#3b5bff 0,transparent 70%),radial-gradient(55% 55% at 80% 30%,#b13cff 0,transparent 70%),radial-gradient(60% 60% at 55% 95%,#ff4d7d 0,transparent 70%),var(--bg);filter:saturate(1.1);animation:drift 24s ease-in-out infinite alternate}
:root[data-theme=light] .wall{opacity:.55}
@keyframes drift{to{transform:scale(1.15) translate(-2%,2%)}}
.dim{position:fixed;inset:0;background:#000;pointer-events:none;z-index:50}
.rm *{animation-duration:0s!important;transition-duration:0s!important}
.g{background:var(--glass);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 12px 40px rgba(0,0,0,.25)}
.f{outline:none;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.f.on{outline:3px solid #fff;outline-offset:3px}
#boot{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;transition:opacity .8s}
#boot.out{opacity:0;pointer-events:none}
.orb{width:120px;height:120px;border-radius:50%;background:conic-gradient(from 0deg,#0a84ff,#bf5af2,#ff375f,#ff9f0a,#30d158,#0a84ff);filter:blur(1px);animation:orb 2.2s ease-in-out both}
@keyframes orb{0%{transform:scale(.2) rotate(0);opacity:0}50%{opacity:1}100%{transform:scale(1) rotate(360deg)}}
#boot b{position:absolute;margin-top:220px;font-weight:600;letter-spacing:.02em;font-size:28px;opacity:0;animation:fi 1s .9s forwards}
@keyframes fi{to{opacity:1}}
#home{position:fixed;inset:0;padding:5vh 5vw;display:flex;flex-direction:column;transition:transform .5s,opacity .5s}
#home.back{transform:scale(.92);opacity:0;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;font-size:22px}
.clock{font-size:clamp(48px,7vw,96px);font-weight:700;letter-spacing:-.03em}
.date{color:var(--dim);font-size:22px;margin-top:4px}
.stat{display:flex;gap:18px;font-size:26px}
.row{margin-top:auto;margin-bottom:12vh;display:flex;gap:2.2vw;overflow:visible}
.app{flex:1 1 0;max-width:15vw;text-align:center}
.ic{aspect-ratio:1;border-radius:22%;display:grid;place-items:center;font-size:clamp(40px,5vw,72px);box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.app.on .ic,.app:focus .ic{transform:scale(1.14) translateY(-6px);box-shadow:0 30px 60px rgba(0,0,0,.5)}
.app span{display:block;margin-top:16px;font-size:20px;opacity:0;transition:opacity .2s}
.app.on span{opacity:1}
.app.on{outline:none}
.hint{position:fixed;bottom:3vh;left:0;right:0;text-align:center;color:var(--dim);font-size:16px}
#cc{position:fixed;left:50%;top:0;width:min(860px,92vw);z-index:60;transform:translate(-50%,-110%);transition:transform .45s cubic-bezier(.2,.9,.25,1);border-radius:0 0 36px 36px;padding:32px 36px 36px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
#cc.open{transform:translate(-50%,0)}
.tile{border-radius:26px;padding:18px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;font-size:20px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.tile.act{background:var(--acc);color:#fff}
.tile i{font-style:normal;font-size:34px}
.sl{grid-column:span 2;position:relative;overflow:hidden;min-height:120px}
.sl .fill{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.85);width:50%;transition:width .12s}
.sl>*{position:relative}.sl .lab{mix-blend-mode:difference;color:#fff}
.sl i{mix-blend-mode:difference;color:#fff}
#set{position:fixed;inset:0;z-index:40;padding:6vh 12vw;overflow:auto;background:rgba(0,0,0,.35);backdrop-filter:blur(40px);transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.9,.25,1)}
#set.open{transform:none}
h1{font-size:56px;font-weight:700;margin-bottom:24px}
.card{border-radius:30px;padding:8px 0;margin-bottom:28px}
.li{display:flex;align-items:center;gap:22px;padding:18px 26px;font-size:26px;border-radius:24px;margin:2px 8px}
.li .bi{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:30px}
.li .v{margin-left:auto;color:var(--dim)}
.li.on{background:rgba(255,255,255,.22)}
.li .sw{margin-left:auto;width:78px;height:46px;border-radius:30px;background:rgba(120,120,128,.5);position:relative;transition:.25s}
.li .sw:after{content:"";position:absolute;top:3px;left:3px;width:40px;height:40px;border-radius:50%;background:#fff;transition:.25s}
.li .sw.t{background:#30d158}.li .sw.t:after{left:35px}
.prof{display:flex;align-items:center;gap:24px;padding:24px 30px;font-size:40px;font-weight:600;border-radius:34px;margin-bottom:28px}
.prof small{display:block;font-size:22px;color:var(--dim);font-weight:400;margin-top:4px}
.av{width:96px;height:96px;border-radius:50%;background:conic-gradient(#0a84ff,#bf5af2,#ff375f,#0a84ff);display:grid;place-items:center;font-size:40px}
.note{color:var(--dim);font-size:18px;padding:0 12px 24px;line-height:1.4}
#toast{position:fixed;bottom:8vh;left:50%;transform:translate(-50%,30px);opacity:0;padding:14px 28px;border-radius:30px;z-index:70;font-size:22px;transition:.3s}
#toast.s{opacity:1;transform:translate(-50%,0)}

:root[data-theme=light] .wall{opacity:1;filter:brightness(1.12)}
body{touch-action:manipulation}
.g{background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.07));backdrop-filter:blur(32px) saturate(1.9);-webkit-backdrop-filter:blur(32px) saturate(1.9);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.1),0 14px 44px rgba(0,0,0,.3)}
#home{padding:3.5vh 3.5vw 3vh}
.clock{font-size:clamp(34px,4.2vw,64px)}.date{font-size:clamp(14px,1.5vw,22px)}
.stat{font-size:clamp(14px,1.4vw,22px);gap:14px;align-items:center;padding:10px 22px;border-radius:30px;margin-top:6px}
.hint{display:none}
.row{margin:2.5vh 0 0;flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr);gap:2.6vh 1.6vw;min-height:0}
.shelf{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:1.6vw;padding:1.6vh 1.3vw;border-radius:34px}
.app{max-width:none;position:relative;min-height:0;height:100%;text-align:left}
.ic{aspect-ratio:auto;height:100%;width:100%;border-radius:18px;font-weight:800;font-size:clamp(14px,2.2vw,38px);letter-spacing:-.02em;overflow:hidden}
.app.on .ic{transform:scale(1.17);box-shadow:0 30px 60px rgba(0,0,0,.55)}
.app span{position:absolute;left:0;right:0;top:calc(100% + 14px);text-align:center;margin:0;font-size:clamp(13px,1.3vw,20px);text-shadow:0 2px 8px #000}
.fold{display:grid;grid-template-columns:repeat(3,1fr);gap:6%;padding:10%;width:100%;height:100%}.fold u{border-radius:6px;background:var(--c)}
#isl{position:fixed;top:14px;left:50%;transform:translateX(-50%);height:46px;width:0;border-radius:32px;z-index:80;display:flex;align-items:center;gap:12px;overflow:hidden;opacity:0;white-space:nowrap;background:rgba(0,0,0,.72);transition:width .55s cubic-bezier(.3,1.35,.4,1),height .45s,opacity .3s}
#isl.show{width:230px;opacity:1;padding:0 14px}
#isl.big{width:min(470px,92vw);height:78px;border-radius:40px;padding:0 20px}
#isl .ii{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex:none}
#isl.big .ii{width:52px;height:52px;border-radius:14px;font-size:28px}
#isl .it{display:flex;flex-direction:column;overflow:hidden;font-size:17px;color:#fff}#isl small{color:rgba(255,255,255,.7);font-size:15px;overflow:hidden;text-overflow:ellipsis}
.eq{display:flex;gap:3px;align-items:flex-end;height:20px;margin-left:auto}.eq u{width:4px;background:#ff375f;border-radius:2px;animation:eq .8s ease-in-out infinite alternate}.eq u:nth-child(2){animation-delay:.2s}.eq u:nth-child(3){animation-delay:.4s}.eq u:nth-child(4){animation-delay:.1s}
@keyframes eq{from{height:4px}to{height:20px}}
@media(max-width:700px){#home{overflow:auto}.row{grid-template-columns:repeat(3,1fr);grid-template-rows:none;grid-auto-rows:88px}.shelf{grid-template-columns:repeat(3,1fr)}}
.f{transition-duration:.16s}
#cc,#set{transition-timing-function:cubic-bezier(.25,1.25,.35,1)}
#cc{grid-template-columns:repeat(5,1fr);width:min(1000px,94vw)}.sl[data-s=br]{grid-column:span 3}.sl[data-s=vol]{grid-column:span 2}
.ic{position:relative}.ic::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-130%);pointer-events:none}.app.on .ic::after{transform:translateX(130%);transition:transform .9s}
#app{position:fixed;inset:0;z-index:45;overflow:hidden;visibility:hidden;transform-origin:0 0;border-radius:18px;transition:transform .55s cubic-bezier(.25,1.15,.35,1),opacity .35s,border-radius .55s;box-shadow:0 40px 120px rgba(0,0,0,.6)}
#app.open{visibility:visible}

else if(k=='ArrowDown'){e.preventDefault();move('D')}else if(k=='ArrowUp'){e.preventDefault();move('U')}
